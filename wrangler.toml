name = "cars-data-api"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive binding — real config, created 2026-07-26. Points at cars_prod
# via Cloudflare Tunnel (cloudflared on the primary, no public Postgres
# exposure) + a dedicated read-only role (cars_api_readonly, CONNECTION
# LIMIT 10) protected by Cloudflare Access (service token).
# `localConnectionString` still lets `wrangler dev --local` talk to the
# local cars_v3 Postgres instead, for fast iteration without hitting prod.
# x402 v2 — pay per request for callers without a key (T216, activated by T230).
# In THIS file, not in the dashboard and not as `--var`: `wrangler deploy`
# replaces the Worker's vars with what is written here, so an address set any
# other way is silently dropped by the next deploy of any task — and x402 turns
# itself off without a trace. Public values only; nothing here is a secret.
#
# X402_PAY_TO is the switch (src/lib/x402-config.ts): remove the line and the
# Worker answers keyless requests 401, as before T216. The address is the
# owner's Coinbase Wallet (self-custody), read from the extension on 2026-10-11;
# checksum form 0x3866d32426A12db52e155563768Bea9516BBAb49.
#
# MAINNET since T231 (owner, 2026-10-11: "hai pe mainnet cu PayAI"). Base
# (eip155:8453), USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. The facilitator
# is PayAI — x402.org settles testnet only, and the config refuses a mainnet
# without an explicit X402_FACILITATOR_URL (T226). PayAI, read 2026-10-11 off
# /supported and /pricing: v2 `exact` on eip155:8453, gas sponsored, free plan
# = 1,000 settlements in total, then $0.001 credits per settlement (Base:
# $0.00218) bought at merchant.payai.network with an API key — which this
# Worker does NOT send yet. When the free plan runs out PayAI answers 403
# `free_tier_exhausted`; the Worker then logs settle_failed with that reason
# (T226) and serves nothing unpaid. Back to testnet: delete the two lines below.
[vars]
X402_PAY_TO = "0x3866d32426a12db52e155563768bea9516bbab49"
X402_NETWORK = "base"
X402_FACILITATOR_URL = "https://facilitator.payai.network"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "1251f42dbc744e85b46313e3344473a0"
# password is a dummy value: local pg_hba.conf trusts 127.0.0.1 and ignores it
localConnectionString = "postgresql://mmalaias-mac:localdev@127.0.0.1:5432/cars_v3"

# API keys + usage/rate-limit counters. Real namespace, created 2026-07-26.
[[kv_namespaces]]
binding = "API_KEYS"
id = "4bfd13f1489b4e1482f441f4fcf33a3f"

# Remote MCP server (L2b) — streamable HTTP, backed by a SQLite Durable
# Object per the Cloudflare Agents SDK's McpAgent pattern. Stateless from our
# read-model's point of view (each tool call is a plain Hyperdrive read);
# the DO only holds the MCP session/transport state.
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "CarsDataMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CarsDataMCP"]

# Usage observability (BIZ-D7 §5): one custom datapoint per MCP tool call, REST
# request and anon-429, queried via the Analytics Engine SQL API by
# scripts/usage-report.mjs. Datapoints are tiny (5 blobs + 1 double vs the
# 20-blob/16 KB cap); 3-month retention. Available on Workers Paid (this account
# already runs Hyperdrive + a Durable Object).
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "cars_data_api_usage"

# Persistent Workers Logs — a debugging aid, not analytics (retention per plan).
[observability]
enabled = true

# IP_HASH_SALT is NOT set here on purpose — it's a Worker secret so the salt
# isn't committed (`wrangler secret put IP_HASH_SALT`); .dev.vars holds it for
# `wrangler dev`. Only salted IP *hashes* are ever written to analytics (GDPR).
